spring.application.name=CloudFileStorage
spring.profiles.active=dev
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:redis}
spring.session.timeout=2h

minio.access-key=${MINIO_USER}
minio.secret-key=${MINIO_PASSWORD}
minio.bucket=user-files
minio.prefix.template=user-%s-files/

logging.level.root=INFO
logging.level.org.springdoc=ERROR

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-http-form-post-size=220MB
server.tomcat.max-part-count=50